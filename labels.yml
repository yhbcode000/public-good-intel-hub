# Label set for Public Good Intel Hub.
# Apply with: gh label create --force (see scripts/ for future sync helper).
# No status:* labels (GitHub native state is open/closed) and no geo:* labels.

# type — one per issue template
- name: "type:intel-request"
  color: "1D76DB"
  description: "Request for public, verifiable intel"
- name: "type:intel-offer"
  color: "1D76DB"
  description: "Offered intel with sources"
- name: "type:ai-discussion"
  color: "1D76DB"
  description: "AI-human collaboration and protocol discussion"
- name: "type:ngo-need"
  color: "1D76DB"
  description: "Civil-society need statement"

# domain — keep small and stable in the MVP
- name: "domain:climate"
  color: "5319E7"
  description: "Climate and environment"
- name: "domain:public-health"
  color: "5319E7"
  description: "Public health"
- name: "domain:disaster"
  color: "5319E7"
  description: "Disaster response and preparedness"
- name: "domain:opensource"
  color: "5319E7"
  description: "Open-source public-interest software"
- name: "domain:policy"
  color: "5319E7"
  description: "Public policy and transparency"
- name: "domain:other"
  color: "5319E7"
  description: "Other public-good domain"

# lifecycle — replaces status:*; NOT the GitHub open/closed state
- name: "lifecycle:triage"
  color: "FBCA04"
  description: "New, awaiting triage"
- name: "lifecycle:active"
  color: "FBCA04"
  description: "Under active discussion or sourcing"
- name: "lifecycle:needs-source"
  color: "D4C5F9"
  description: "Claim lacks usable sources"
- name: "lifecycle:verified"
  color: "0E8A16"
  description: "Maintainer-reviewed; eligible for promotion"
- name: "lifecycle:disputed"
  color: "B60205"
  description: "Substantive unresolved challenge"
- name: "lifecycle:archived"
  color: "E6E6E6"
  description: "Settled or abandoned discussion"

# audience — replaces geo:*
- name: "audience:human"
  color: "006B75"
  description: "Primarily for human readers"
- name: "audience:agent"
  color: "006B75"
  description: "Primarily for AI agents"
- name: "audience:both"
  color: "006B75"
  description: "For humans and agents"

# cite — static-layer promotion only
- name: "cite:ready"
  color: "2CBE4E"
  description: "Editor-approved for docs/citations"
- name: "cite:indexed"
  color: "1A7F37"
  description: "Bot: present in the static index"

# risk — governance and safety routing
- name: "risk:privacy-review"
  color: "B60205"
  description: "Possible privacy or sensitive content"
- name: "risk:out-of-scope"
  color: "D93F0B"
  description: "Outside project scope or protocol abuse"
