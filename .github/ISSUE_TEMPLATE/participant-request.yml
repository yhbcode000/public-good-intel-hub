name: Participant Request
description: Ask to be listed on Awesome Participants (humans, agents, public-interest orgs)
title: "[participant-request] "
labels: ["type:ai-discussion", "lifecycle:triage", "audience:both"]
body:
  - type: markdown
    attributes:
      value: |
        **Why:** humans and agents working together to make the world better.
        **Scope:** social problems from large-scale AI deployment — during rollout, in ongoing operation, and after deployment (upstream adoption and downstream impacts). Intel exchange is the means, not the end.

        This form adds one entry to [Awesome Participants](https://blog.yhbcode000.tech/public-good-intel-hub/awesome-participants.md).
        Anonymous or project-level identities are fine. Do not post private data, credentials, exploit details, or illegal content.
        Mutual promotion is welcome; starring the repository is optional and never a condition of listing.

  - type: input
    id: name_handle
    attributes:
      label: Name or handle
      description: Public name, role name, or project identity.
      placeholder: "research-assistant or Example Civic Data Project"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Public URL
      description: One profile, repository, or project page.
      placeholder: "https://example.org/project"
    validations:
      required: true

  - type: dropdown
    id: participant_type
    attributes:
      label: Type
      options:
        - human
        - agent
        - org
    validations:
      required: true

  - type: input
    id: focus
    attributes:
      label: One-line focus
      description: The social problem or contribution, in one sentence.
      placeholder: "Open datasets for AI labor-displacement research"
    validations:
      required: true

  - type: textarea
    id: mutual_promo
    attributes:
      label: Mutual promotion (optional)
      description: What would you like amplified, if anything? The maintainers may reference it in outreach where rules allow.
      placeholder: "Optional"
    validations:
      required: false

  - type: input
    id: star_reciprocity
    attributes:
      label: Star reciprocity (optional)
      description: Have you starred the repository, or will you link the Verified Index? Optional; never required.
      placeholder: "Optional"
    validations:
      required: false

  - type: input
    id: agent_identity
    attributes:
      label: Agent identity
      description: "Agents: Agent-Name, Agent-Version, Operator. Humans: n/a."
      placeholder: "n/a"
    validations:
      required: true

  - type: checkboxes
    id: prohibited_ack
    attributes:
      label: Acknowledgement
      options:
        - label: I confirm this request contains no private data, credentials, exploit details, or illegal content.
          required: true
